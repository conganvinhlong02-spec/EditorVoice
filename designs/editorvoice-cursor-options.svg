<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Bốn phương án icon chuột bo tròn cho EditorVoice</title>
  <desc id="desc">Các mẫu cursor với đầu mũi tên mềm, bo tròn theo phong cách EditorVoice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7ffe2"/><stop offset=".52" stop-color="#faf9f4"/><stop offset="1" stop-color="#eee9ff"/></linearGradient>
    <linearGradient id="neon" x1=".12" y1="0" x2=".9" y2="1"><stop stop-color="#d9ff67"/><stop offset=".5" stop-color="#8a6cff"/><stop offset="1" stop-color="#3e3671"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".98"/><stop offset="1" stop-color="#b7a9ff" stop-opacity=".88"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#312d58" flood-opacity=".22"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="430" rx="30" fill="url(#bg)"/>
  <text x="52" y="67" fill="#111217" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="800">Chọn icon chuột EditorVoice</text>
  <text x="52" y="99" fill="#737583" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="600">Phiên bản bo tròn nhẹ — thân mượt hơn, thân thiện nhưng vẫn rõ nét khi thao tác</text>

  <g transform="translate(48 136)">
    <rect width="258" height="242" rx="22" fill="#111217" filter="url(#shadow)"/>
    <circle cx="129" cy="96" r="54" fill="#7b61ff" opacity=".18" filter="url(#glow)"/>
    <path d="M91 47c-5-2-9 3-7 8l25 92c2 7 11 8 15 2l17-28 27 26c4 4 10 4 14 0l9-9c4-4 4-10 0-14l-27-27 29-15c6-3 5-12-2-15L91 47Z" fill="url(#neon)" stroke="#fff" stroke-width="4" stroke-linejoin="round" filter="url(#shadow)"/>
    <path d="m143 120 23 22" fill="none" stroke="#d9ff67" stroke-width="7" stroke-linecap="round"/>
    <text x="22" y="184" fill="#d9ff67" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">A · NEON PULSE</text>
    <text x="22" y="211" fill="#d5d5dc" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="600">Bo tròn · năng động · dễ thấy</text>
  </g>

  <g transform="translate(330 136)">
    <rect width="258" height="242" rx="22" fill="#fff" stroke="#dedde7" filter="url(#shadow)"/>
    <path d="M91 47c-5-2-9 3-7 8l25 92c2 7 11 8 15 2l17-28 27 26c4 4 10 4 14 0l9-9c4-4 4-10 0-14l-27-27 29-15c6-3 5-12-2-15L91 47Z" fill="#171725" stroke="#171725" stroke-width="4" stroke-linejoin="round"/>
    <path d="m143 120 22 22" fill="none" stroke="#8068ff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="173" cy="53" r="8" fill="#d9ff67"/>
    <text x="22" y="184" fill="#111217" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">B · PRECISION</text>
    <text x="22" y="211" fill="#737583" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="600">Bo tròn · tối giản · chuyên nghiệp</text>
  </g>

  <g transform="translate(612 136)">
    <rect width="258" height="242" rx="22" fill="#171725" filter="url(#shadow)"/>
    <circle cx="129" cy="96" r="61" fill="none" stroke="#7b61ff" stroke-width="2" opacity=".55"/>
    <path d="M91 47c-5-2-9 3-7 8l25 92c2 7 11 8 15 2l17-28 27 26c4 4 10 4 14 0l9-9c4-4 4-10 0-14l-27-27 29-15c6-3 5-12-2-15L91 47Z" fill="#f8f7ff" stroke="#d9ff67" stroke-width="4" stroke-linejoin="round"/>
    <path d="M149 122c8-10 18-10 26 0s18 10 26 0" fill="none" stroke="#8068ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M151 137c6-7 13-7 19 0s13 7 19 0" fill="none" stroke="#d9ff67" stroke-width="4" stroke-linecap="round"/>
    <text x="22" y="184" fill="#d9ff67" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">C · STUDIO WAVE</text>
    <text x="22" y="211" fill="#d5d5dc" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="600">Bo tròn · âm thanh · cá tính</text>
  </g>

  <g transform="translate(894 136)">
    <rect width="258" height="242" rx="22" fill="#f5f2ff" stroke="#dcd5ff" filter="url(#shadow)"/>
    <path d="M91 47c-5-2-9 3-7 8l25 92c2 7 11 8 15 2l17-28 27 26c4 4 10 4 14 0l9-9c4-4 4-10 0-14l-27-27 29-15c6-3 5-12-2-15L91 47Z" fill="url(#glass)" stroke="#6753db" stroke-width="4" stroke-linejoin="round"/>
    <path d="M99 62c15 7 31 15 47 23" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <circle cx="166" cy="129" r="16" fill="#d9ff67" opacity=".92"/><circle cx="166" cy="129" r="7" fill="#312d58"/>
    <text x="22" y="184" fill="#5440bd" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">D · SOFT GLASS</text>
    <text x="22" y="211" fill="#737583" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="600">Bo tròn · mềm mại · hiện đại</text>
  </g>
</svg>
